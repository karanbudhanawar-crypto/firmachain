<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="250" viewBox="0 0 1800 250" role="img" aria-label="Microchip circuit artwork and security shield">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06172b"/><stop offset=".5" stop-color="#06203b"/><stop offset="1" stop-color="#04172e"/>
  </linearGradient>
  <radialGradient id="glow" cx="80%" cy="58%" r="55%">
    <stop offset="0" stop-color="#0879c4" stop-opacity=".30"/><stop offset="1" stop-color="#06182c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0878bf" stop-opacity=".05"/><stop offset=".38" stop-color="#0b84cd" stop-opacity=".42"/><stop offset=".78" stop-color="#0bb9ef" stop-opacity=".96"/><stop offset="1" stop-color="#0b9be2" stop-opacity=".85"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b4a7d"/><stop offset=".52" stop-color="#07365e"/><stop offset="1" stop-color="#061f3d"/>
  </linearGradient>
  <filter id="glowLine" x="-20%" y="-100%" width="140%" height="300%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
  <filter id="chipGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1800" height="250" fill="url(#bg)"/>
<rect width="1800" height="250" fill="url(#glow)"/>
<!-- flowing circuit traces -->
<path d="M-20 172 C250 154 510 143 760 132 S1330 100 1820 20" fill="none" stroke="#0876bf" stroke-opacity=".32" stroke-width="5" filter="url(#glowLine)"/>
<path d="M-20 172 C250 154 510 143 760 132 S1330 100 1820 20" fill="none" stroke="url(#trace)" stroke-width="2"/>
<path d="M-20 206 C330 189 550 176 820 166 S1350 140 1820 76" fill="none" stroke="#0876bf" stroke-opacity=".22" stroke-width="4" filter="url(#glowLine)"/>
<path d="M-20 206 C330 189 550 176 820 166 S1350 140 1820 76" fill="none" stroke="url(#trace)" stroke-opacity=".72" stroke-width="1.6"/>
<path d="M-20 103 C250 99 460 97 720 90" fill="none" stroke="#0c6cae" stroke-opacity=".18" stroke-width="1"/>
<!-- chip orbit rings -->
<g fill="none" stroke="#0b8fc9" stroke-opacity=".43">
  <ellipse cx="1435" cy="130" rx="244" ry="104" transform="rotate(-13 1435 130)"/>
  <ellipse cx="1435" cy="130" rx="204" ry="83" transform="rotate(-13 1435 130)" stroke-opacity=".32"/>
  <ellipse cx="1435" cy="130" rx="164" ry="64" transform="rotate(-13 1435 130)" stroke-opacity=".2"/>
</g>
<!-- Small data-circuit ornament -->
<g transform="translate(930 126)" fill="none" stroke="#28d9e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
  <path d="M-27 0 H-9 M9 0 H28 M0 -23 V-9 M0 9 V23"/>
  <circle cx="0" cy="0" r="9" fill="#073b5c" stroke="#24d4e8"/>
  <circle cx="-27" cy="0" r="3.2" fill="#20d6e6" stroke="none"/>
  <circle cx="28" cy="0" r="3.2" fill="#20d6e6" stroke="none"/>
  <circle cx="0" cy="-23" r="3.2" fill="#20d6e6" stroke="none"/>
  <circle cx="0" cy="23" r="3.2" fill="#20d6e6" stroke="none"/>
  <path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke-width="1.8"/>
</g>
<!-- ESP32 chip -->
<g transform="rotate(-17 1422 126)" filter="url(#chipGlow)">
  <rect x="1284" y="61" width="272" height="126" rx="23" fill="url(#chip)" stroke="#16b9eb" stroke-width="2.5"/>
  <rect x="1295" y="72" width="250" height="104" rx="16" fill="none" stroke="#1987be" stroke-opacity=".48"/>
  <g stroke="#159bd2" stroke-width="3" stroke-linecap="round">
    <path d="M1311 61V44 M1340 61V44 M1369 61V44 M1398 61V44 M1427 61V44 M1456 61V44 M1485 61V44 M1514 61V44"/>
    <path d="M1311 187V204 M1340 187V204 M1369 187V204 M1398 187V204 M1427 187V204 M1456 187V204 M1485 187V204 M1514 187V204"/>
  </g>
  <g fill="none" stroke="#b8ecff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1398" y="105" width="44" height="42" rx="7" fill="#0c4b76" fill-opacity=".72"/>
    <path d="M1406 98V105 M1417 98V105 M1428 98V105 M1439 98V105 M1406 147V154 M1417 147V154 M1428 147V154 M1439 147V154"/>
    <path d="M1391 114H1398 M1391 126H1398 M1391 138H1398 M1442 114H1449 M1442 126H1449 M1442 138H1449"/>
    <path d="M1410 126H1430 M1420 116V136" stroke="#24dce5" stroke-width="2.8"/>
    <circle cx="1420" cy="126" r="4.5" fill="#24dce5" stroke="none"/>
  </g>
</g>
<!-- shield emblem -->
<g transform="translate(1600 36)">
  <path d="M47 0 L91 17 L87 72 Q72 91 47 105 Q22 91 7 72 L3 17 Z" fill="#06314d" fill-opacity=".92" stroke="#13c9e8" stroke-width="5"/>
  <path d="M20 51 L39 69 L72 29" fill="none" stroke="#24e4de" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M47 7 L83 21" fill="none" stroke="#65e8f5" stroke-opacity=".5" stroke-width="2"/>
</g>
</svg>