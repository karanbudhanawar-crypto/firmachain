<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="250" viewBox="0 0 1800 250" role="img" aria-label="Minimal cyan circuit path with connected nodes">
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06182b"/>
    <stop offset=".55" stop-color="#07192b"/>
    <stop offset="1" stop-color="#061426"/>
  </linearGradient>
  <linearGradient id="circuit" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#13aabd"/>
    <stop offset=".48" stop-color="#13c1d2"/>
    <stop offset="1" stop-color="#16a9c5"/>
  </linearGradient>
  <radialGradient id="nodeGlow">
    <stop offset="0" stop-color="#27e3ec" stop-opacity=".28"/>
    <stop offset="1" stop-color="#27e3ec" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect width="1800" height="250" fill="url(#background)"/>
<path d="M0 42 H1800" stroke="#16405b" stroke-opacity=".25" stroke-width="1"/>
<path d="M0 207 H1800" stroke="#16405b" stroke-opacity=".2" stroke-width="1"/>
<path d="M0 125 H1800" stroke="#0c3550" stroke-opacity=".15" stroke-width="1"/>
<!-- soft light beneath the circuit -->
<g fill="none" stroke="#12c6d7" stroke-width="7" opacity=".14" filter="url(#softGlow)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M300 125 H640 M720 125 V72 H1080 H1280"/>
  <path d="M780 165 V205 H1280"/>
</g>
<!-- main horizontal trace -->
<g fill="none" stroke="url(#circuit)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M300 125 H640"/>
  <path d="M720 125 V72 H1080"/>
  <path d="M1120 72 H1280"/>
  <path d="M780 165 V205 H1280"/>
</g>
<!-- input point -->
<circle cx="300" cy="125" r="15" fill="url(#nodeGlow)"/>
<circle cx="300" cy="125" r="6.5" fill="#18c4d5"/>
<!-- central square with plus -->
<rect x="640" y="90" width="80" height="75" rx="3" fill="#09253b" stroke="#10b9ca" stroke-width="2.4"/>
<rect x="651" y="101" width="58" height="53" rx="5" fill="none" stroke="#136782" stroke-width="1.2"/>
<path d="M680 112 V143 M664.5 127.5 H695.5" stroke="#18c5d7" stroke-width="3.2" stroke-linecap="round"/>
<circle cx="720" cy="125" r="5.5" fill="#16becf"/>
<!-- upper hexagon terminal -->
<path d="M1080 56 L1095 47 L1110 56 V76 L1095 85 L1080 76 Z" fill="#08263b" stroke="#12b8ca" stroke-width="2.2"/>
<path d="M1095 47 V37 M1095 85 V94" stroke="#0e829f" stroke-width="2"/>
<circle cx="1280" cy="72" r="15" fill="url(#nodeGlow)"/>
<circle cx="1280" cy="72" r="6.5" fill="#18c4d5"/>
<!-- lower connector -->
<path d="M1192 190 H1242 V220 H1306" fill="none" stroke="#148ca7" stroke-width="2" opacity=".65"/>
<rect x="1245" y="190" width="38" height="30" rx="2" fill="#08263b" stroke="#11aabc" stroke-width="2"/>
<path d="M1264 183 V190 M1264 220 V228 M1238 205 H1245 M1283 205 H1292" stroke="#11aabc" stroke-width="2"/>
<circle cx="1306" cy="205" r="6" fill="#18c4d5"/>
<!-- subtle trace ends -->
<path d="M1306 205 H1390" stroke="#0b7691" stroke-width="1.4" opacity=".45"/>
</svg>