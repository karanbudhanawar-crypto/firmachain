<svg xmlns="http://www.w3.org/2000/svg" width="1502" height="212" viewBox="0 0 1502 212" role="img" aria-label="FirmaChain ESP32-S3 firmware security banner">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06172c"/>
    <stop offset=".52" stop-color="#06203a"/>
    <stop offset="1" stop-color="#04172b"/>
  </linearGradient>
  <radialGradient id="rightGlow" cx="81%" cy="53%" r="48%">
    <stop offset="0" stop-color="#0876bd" stop-opacity=".29"/>
    <stop offset="1" stop-color="#061a30" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0a6ba9" stop-opacity=".26"/>
    <stop offset=".42" stop-color="#0a8dcc" stop-opacity=".7"/>
    <stop offset=".78" stop-color="#09b9ed"/>
    <stop offset="1" stop-color="#11a9e9"/>
  </linearGradient>
  <linearGradient id="chipFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b4b7b"/>
    <stop offset=".48" stop-color="#0a3158"/>
    <stop offset="1" stop-color="#071f3c"/>
  </linearGradient>
  <filter id="lineGlow" x="-10%" y="-80%" width="120%" height="260%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>
  <filter id="chipGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shieldGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1502" height="212" rx="15" fill="url(#base)"/>
<rect width="1502" height="212" rx="15" fill="url(#rightGlow)"/>
<!-- Thin flowing traces across the banner -->
<path d="M-20 145 C245 129 475 121 690 108 S1130 76 1525 16" fill="none" stroke="#087fc4" stroke-opacity=".36" stroke-width="6" filter="url(#lineGlow)"/>
<path d="M-20 145 C245 129 475 121 690 108 S1130 76 1525 16" fill="none" stroke="url(#trace)" stroke-width="2"/>
<path d="M-20 172 C270 154 478 148 720 136 S1180 107 1525 63" fill="none" stroke="#087fc4" stroke-opacity=".27" stroke-width="4" filter="url(#lineGlow)"/>
<path d="M-20 172 C270 154 478 148 720 136 S1180 107 1525 63" fill="none" stroke="url(#trace)" stroke-opacity=".75" stroke-width="1.5"/>
<path d="M0 76 C220 74 415 73 600 74" fill="none" stroke="#0e527b" stroke-opacity=".18" stroke-width="1"/>
<!-- SHA-256 glass label -->
<rect x="741" y="94" width="95" height="27" rx="5" fill="#05213a" fill-opacity=".94" stroke="#087eae" stroke-opacity=".92"/>
<text x="788.5" y="111.5" text-anchor="middle" fill="#31dce6" font-family="Consolas,monospace" font-size="10.5" letter-spacing="1.4">SHA-256</text>
<!-- Chip orbit rings -->
<g fill="none" stroke="#087eb5" stroke-opacity=".43">
  <ellipse cx="1186" cy="112" rx="193" ry="91" transform="rotate(-13 1186 112)"/>
  <ellipse cx="1186" cy="112" rx="164" ry="74" transform="rotate(-13 1186 112)" stroke-opacity=".34"/>
  <ellipse cx="1186" cy="112" rx="137" ry="58" transform="rotate(-13 1186 112)" stroke-opacity=".22"/>
</g>
<!-- Tilted ESP32-S3 chip -->
<g transform="rotate(-15 1188 108)" filter="url(#chipGlow)">
  <rect x="1064" y="43" width="246" height="130" rx="20" fill="url(#chipFace)" stroke="#10bce9" stroke-width="2.5"/>
  <rect x="1075" y="54" width="224" height="108" rx="14" fill="none" stroke="#218cc1" stroke-opacity=".5" stroke-width="1.1"/>
  <g stroke="#14a8d8" stroke-width="2.6" stroke-linecap="round">
    <path d="M1084 43V26 M1111 43V26 M1138 43V26 M1165 43V26 M1192 43V26 M1219 43V26 M1246 43V26 M1273 43V26"/>
    <path d="M1084 173V190 M1111 173V190 M1138 173V190 M1165 173V190 M1192 173V190 M1219 173V190 M1246 173V190 M1273 173V190"/>
  </g>
  <text x="1187" y="116" text-anchor="middle" fill="#d4efff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing=".7">ESP32-S3</text>
</g>
<!-- Shield with check -->
<g transform="translate(1329 25)" filter="url(#shieldGlow)">
  <path d="M48 0 L86 15 L83 60 Q69 81 48 91 Q27 81 13 60 L10 15 Z" fill="#06304b" fill-opacity=".96" stroke="#10cce9" stroke-width="4"/>
  <path d="M28 45 L43 59 L68 28" fill="none" stroke="#20e3dc" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>